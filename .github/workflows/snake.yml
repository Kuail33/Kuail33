name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kuail33
          outputs: |
            dist/github-snake.svg?color_snake=#1a8a1a&color_dots=#e8e8e8,#a8d5a2,#4a7c3f,#2d6a2e,#c8a200
            dist/github-snake-dark.svg?color_snake=#4adf4a&color_dots=#2d2d2d,#2d4a22,#4a7c3f,#8fbc54,#c8a200

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output