name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # runs every 12 hours
  workflow_dispatch: # allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kuail33
          outputs: |
            dist/github-snake.svg?color_snake=#1a8a1a&color_dots=#1a1a2e,#2d4a22,#4a7c3f,#8fbc54,#c8a200
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4adf4a&color_dots=#1a1a2e,#2d4a22,#4a7c3f,#8fbc54,#c8a200
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}